# Netlify config for the SilvaPixel Next.js app.
# Lives at repo root; deploys the journeycraft/ subdirectory.
# Netlify auto-installs @netlify/plugin-nextjs when Next.js is detected,
# which handles SSR / ISR / dynamic routes / image optimization for you.

[build]
  base    = "journeycraft"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Pin to a modern Node LTS that matches Next 16 requirements.
  NODE_VERSION = "20"
  # Speed up CI installs.
  NPM_FLAGS    = "--no-audit --no-fund"

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
