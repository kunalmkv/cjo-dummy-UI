<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrations — JourneyCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
</head>
<body>
  <div id="app-shell-slot">
    <div style="display:flex;flex-direction:column;gap:24px">
      <header class="page-header">
        <div style="min-width:0">
          <div class="page-eyebrow">Integrations</div>
          <h1 class="page-title text-balance">Connect the rest of your stack</h1>
          <p class="page-desc text-pretty">Pre-built connectors and a full webhook API. Sync data both ways without writing glue code.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm" id="b1"></button>
          <button class="btn btn-primary btn-sm" id="b2"></button>
        </div>
      </header>

      <div class="card" style="overflow:hidden">
        <div class="mesh-bg" style="padding:20px">
          <div class="row-center gap-3" style="max-width:48rem">
            <span style="width:40px;height:40px;border-radius:var(--radius-lg);background:var(--color-bg-elev);border:1px solid var(--color-border);color:var(--color-accent-500);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pop);flex-shrink:0" id="sd-ic"></span>
            <div style="flex:1">
              <div class="font-display fw-600" style="font-size:14px;letter-spacing:-.01em">Build your own with the Universal connector</div>
              <p class="text-muted" style="font-size:12px">Define a config in YAML — get an integration with auth, retries and observability out of the box.</p>
            </div>
            <button class="btn btn-secondary btn-sm">Try the SDK</button>
          </div>
        </div>
      </div>

      <div class="row-between" style="gap:12px;flex-wrap:wrap">
        <div class="tabs-row" id="tabs"></div>
        <div class="row-center gap-2">
          <div class="input-wrap" style="width:280px">
            <span class="input-icon-left" id="srch-icon"></span>
            <input class="input input-with-icon-left" placeholder="Search integrations…"/>
          </div>
          <button class="btn btn-secondary" id="flt"></button>
        </div>
      </div>

      <div class="grid grid-1 sm-grid-2 lg-grid-3 xl-grid-4" id="grid" style="gap:12px"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="shell.js"></script>
  <script>
    renderAppShell('integrations.html');
    document.getElementById('b1').innerHTML = icon('external-link','4') + ' API docs';
    document.getElementById('b2').innerHTML = icon('plus','4') + ' Request integration';
    document.getElementById('sd-ic').innerHTML = icon('sparkles','4p5');
    document.getElementById('srch-icon').innerHTML = icon('search','4');
    document.getElementById('flt').innerHTML = icon('filter','4') + ' Filter';

    const cats = ['All', 'Connected', 'Email', 'SMS', 'CRM', 'Analytics', 'Data warehouse', 'Reverse ETL', 'Productivity', 'Ads'];
    document.getElementById('tabs').innerHTML = cats.map((c, i) => `<button class="tab ${i === 0 ? 'active' : ''}">${c}</button>`).join('');

    const items = [
      { name: 'Payments connector', desc: 'Sync payments, subscriptions and lifetime value.', category: 'CRM', hue: 258, connected: true },
      { name: 'Event pipeline', desc: 'Pipe events from anywhere into JourneyCraft.', category: 'Analytics', hue: 200, connected: true },
      { name: 'Warehouse — reverse ETL', desc: 'Activate warehouse audiences with reverse ETL.', category: 'Data warehouse', hue: 195, connected: true },
      { name: 'SMS provider', desc: 'Send SMS at scale across global carriers.', category: 'SMS', hue: 350 },
      { name: 'Transactional email', desc: 'Transactional email with reliable deliverability.', category: 'Email', hue: 30, trending: true },
      { name: 'Marketing email ESP', desc: 'High-volume email platform for marketing sends.', category: 'Email', hue: 220 },
      { name: 'CRM (mid-market)', desc: 'Two-way sync contacts, deals and lifecycle stages.', category: 'CRM', hue: 16 },
      { name: 'CRM (enterprise)', desc: 'Enterprise CRM sync with field-level mapping.', category: 'CRM', hue: 200 },
      { name: 'Warehouse — query', desc: 'Stream events and run cohort queries.', category: 'Data warehouse', hue: 230 },
      { name: 'Team chat', desc: 'Notify the right channel when key events fire.', category: 'Productivity', hue: 280, trending: true },
      { name: 'Product analytics A', desc: 'Forward events for product analytics.', category: 'Analytics', hue: 270 },
      { name: 'Product analytics B', desc: 'Sync cohorts and behavioral data.', category: 'Analytics', hue: 240 },
      { name: 'Ads — social network', desc: 'Build look-alike audiences from segments.', category: 'Ads', hue: 230 },
      { name: 'Ads — search engine', desc: 'Sync audiences for retargeting and exclusions.', category: 'Ads', hue: 30 },
      { name: 'Issue tracker', desc: 'Open issues when experiments need follow-up.', category: 'Productivity', hue: 258 },
    ];
    document.getElementById('grid').innerHTML = items.map(it => `
      <div class="card" style="padding:16px;position:relative;overflow:hidden">
        <div class="row-center" style="gap:12px;align-items:flex-start">
          <span style="width:40px;height:40px;border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;box-shadow:var(--shadow-pop);flex-shrink:0;background:linear-gradient(135deg,oklch(0.62 0.18 ${it.hue}),oklch(0.5 0.2 ${it.hue}))">${it.name[0]}</span>
          <div style="min-width:0;flex:1">
            <div class="row-center gap-2">
              <h3 class="font-display fw-600 truncate" style="font-size:14px;letter-spacing:-.01em">${it.name}</h3>
              ${it.trending ? '<span class="badge badge-accent">Trending</span>' : ''}
            </div>
            <p class="text-muted" style="font-size:11.5px;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${it.desc}</p>
          </div>
        </div>
        <div class="row-between" style="margin-top:16px">
          <span class="text-subtle uppercase" style="font-size:10.5px;font-weight:600;letter-spacing:.06em">${it.category}</span>
          ${it.connected
            ? `<span class="badge badge-success badge-dot">${icon('check','3')} Connected</span>`
            : `<button class="btn btn-secondary btn-xs">Connect</button>`}
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
