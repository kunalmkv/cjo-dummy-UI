<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates — JourneyCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
</head>
<body>
  <div id="app-shell-slot">
    <div style="display:flex;flex-direction:column;gap:24px">
      <header class="page-header">
        <div style="min-width:0">
          <div class="page-eyebrow">Templates</div>
          <h1 class="page-title text-balance">Start with a template, ship in minutes</h1>
          <p class="page-desc text-pretty">A growing library of message and page templates — vetted, theme-able, and ready to drop into any journey or campaign.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm" id="ai-btn"></button>
          <button class="btn btn-primary btn-sm" id="new-btn"></button>
        </div>
      </header>

      <div class="row-between" style="gap:16px;flex-wrap:wrap;align-items:center">
        <div class="tabs-row" id="tabs"></div>
        <div class="input-wrap" style="width:320px;max-width:100%">
          <span class="input-icon-left" id="srch-icon"></span>
          <input class="input input-with-icon-left" placeholder="Search templates…"/>
        </div>
      </div>

      <div class="grid grid-1 sm-grid-2 xl-grid-3" id="t-grid" style="gap:16px"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="shell.js"></script>
  <script>
    renderAppShell('templates.html');
    document.getElementById('ai-btn').innerHTML = icon('sparkles','4') + ' Generate with AI';
    document.getElementById('new-btn').innerHTML = icon('plus','4') + ' New template';
    document.getElementById('srch-icon').innerHTML = icon('search','4');

    const cats = [
      { label: 'All', count: 124, icon: 'file-text', active: true },
      { label: 'Email', count: 68, icon: 'mail' },
      { label: 'Push', count: 18, icon: 'bell' },
      { label: 'SMS', count: 22, icon: 'message-square' },
      { label: 'In-app', count: 16, icon: 'smartphone' },
    ];
    document.getElementById('tabs').innerHTML = cats.map(c => `
      <button class="tab ${c.active ? 'active' : ''}">${icon(c.icon, '3p5')} ${c.label}<span class="tab-count">${c.count}</span></button>
    `).join('');

    const featured = [
      { name: 'Welcome · Minimal', desc: 'Clean welcome email with a single CTA. Tested across 200+ products.', type: 'Email', hue: 220, usage: 'Used 1,420 times', tag: 'Onboarding' },
      { name: 'Trial reminder · Day 11', desc: 'Two-card layout with social proof and a friendly nudge.', type: 'Email', hue: 70, usage: 'Used 940 times', tag: 'Lifecycle' },
      { name: 'Cart recovery · 3-touch', desc: 'A sequence: nudge, social proof, then a 10% off code.', type: 'Email', hue: 150, usage: 'Used 612 times', tag: 'Ecommerce' },
      { name: 'Push · Re-engagement', desc: 'Short, punchy copy with deep link to the missed feature.', type: 'Push', hue: 320, usage: 'Used 380 times', tag: 'Win-back' },
      { name: 'SMS · OTP verification', desc: 'Concise, deliverable across carriers with 6-digit support.', type: 'SMS', hue: 200, usage: 'Used 2,180 times', tag: 'Transactional' },
      { name: 'In-app · Feature tour', desc: 'Four-step tooltip walkthrough with dismissible callouts.', type: 'In-app', hue: 260, usage: 'Used 220 times', tag: 'Product' },
    ];

    function mockEmail(hue) {
      return `<div style="position:absolute;inset:12px;border-radius:6px;background:var(--color-bg-elev);box-shadow:var(--shadow-pop);padding:12px">
        <div class="row-between">
          <span style="width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,oklch(0.6 0.18 ${hue}),oklch(0.5 0.2 ${hue}))"></span>
          <div style="display:flex;gap:4px">
            <span class="dot-color" style="background:var(--color-border-strong);width:6px;height:6px"></span>
            <span class="dot-color" style="background:var(--color-border-strong);width:6px;height:6px"></span>
            <span class="dot-color" style="background:var(--color-border-strong);width:6px;height:6px"></span>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
          <div style="height:8px;width:75%;border-radius:2px;background:color-mix(in oklch,var(--color-fg) 80%,transparent)"></div>
          <div style="height:6px;width:100%;border-radius:2px;background:var(--color-bg-muted)"></div>
          <div style="height:6px;width:83%;border-radius:2px;background:var(--color-bg-muted)"></div>
          <div style="height:6px;width:67%;border-radius:2px;background:var(--color-bg-muted)"></div>
        </div>
        <div style="margin-top:12px;height:48px;border-radius:4px;background:var(--color-bg-muted);display:flex;align-items:flex-end;padding:6px">
          <span style="height:4px;width:33%;border-radius:2px;background:var(--color-border-strong)"></span>
        </div>
        <div style="margin-top:8px;display:flex;justify-content:center">
          <span style="height:16px;padding:0 16px;border-radius:4px;font-size:8px;color:#fff;font-weight:600;display:inline-flex;align-items:center;background:oklch(0.5 0.2 ${hue})">Get started</span>
        </div>
      </div>`;
    }
    function mockPhone(label, hue, type) {
      return `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px">
        <div style="width:176px;border-radius:24px;border:4px solid color-mix(in oklch,var(--color-fg) 70%,transparent);background:var(--color-bg-elev);aspect-ratio:9/16;padding:8px;box-shadow:var(--shadow-float)">
          <div style="height:4px;width:48px;margin:4px auto 0;border-radius:2px;background:color-mix(in oklch,var(--color-fg) 30%,transparent)"></div>
          <div style="margin-top:16px;border:1px solid var(--color-border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px">
            <div style="font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-fg-subtle)">${type}</div>
            <div style="font-size:9px;line-height:1.2;font-weight:500">${label}</div>
          </div>
        </div>
      </div>`;
    }

    document.getElementById('t-grid').innerHTML = featured.map(t => {
      let mock;
      if (t.type === 'SMS') mock = mockPhone('Your code: 482910', t.hue, t.type);
      else if (t.type === 'Push') mock = mockPhone('We miss you! Tap to pick up where you left off →', t.hue, 'Notification');
      else if (t.type === 'In-app') mock = mockPhone('Try the new AI assistant', t.hue, t.type);
      else mock = mockEmail(t.hue);
      return `
        <div class="card" style="overflow:hidden;cursor:pointer">
          <div style="position:relative;height:176px;border-bottom:1px solid var(--color-border);overflow:hidden;background:linear-gradient(135deg,oklch(0.97 0.04 ${t.hue}),oklch(0.92 0.08 ${t.hue}))">
            <span style="position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:999px;opacity:.3;filter:blur(32px);background:oklch(0.7 0.18 ${t.hue})"></span>
            ${mock}
            <div style="position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px">
              <span class="badge badge-neutral" style="background:color-mix(in oklch,var(--color-bg-elev) 80%,transparent);backdrop-filter:blur(4px)">${t.type}</span>
              <span class="badge badge-brand" style="background:color-mix(in oklch,var(--color-bg-elev) 80%,transparent);backdrop-filter:blur(4px)">${t.tag}</span>
            </div>
            <button style="position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:var(--radius-sm);background:color-mix(in oklch,var(--color-bg-elev) 80%,transparent);backdrop-filter:blur(4px);color:var(--color-fg-muted);display:flex;align-items:center;justify-content:center">${icon('star','3p5')}</button>
          </div>
          <div style="padding:16px">
            <h3 class="font-display fw-600" style="font-size:14.5px;letter-spacing:-.01em">${t.name}</h3>
            <p class="text-muted" style="font-size:12.5px;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${t.desc}</p>
            <div class="row-between" style="margin-top:12px">
              <span class="text-subtle row-center gap-1" style="font-size:11.5px">${icon('users','3')} ${t.usage}</span>
              <button class="btn btn-secondary btn-xs">Preview</button>
            </div>
          </div>
        </div>`;
    }).join('');
  </script>
</body>
</html>
