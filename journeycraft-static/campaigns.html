<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaigns — JourneyCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
</head>
<body>
  <div id="app-shell-slot">
    <div style="display:flex;flex-direction:column;gap:24px">
      <header class="page-header">
        <div style="min-width:0">
          <div class="page-eyebrow">Campaigns</div>
          <h1 class="page-title text-balance">Plan and send one-off broadcasts</h1>
          <p class="page-desc text-pretty">Schedule moment-in-time blasts across email, push, SMS and in-app. Track performance in one place.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm" id="cal-btn"></button>
          <button class="btn btn-primary btn-sm" id="new-btn"></button>
        </div>
      </header>

      <div class="grid grid-2 lg-grid-4" id="stats"></div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--color-border)">
          <div class="input-wrap" style="width:280px">
            <span class="input-icon-left" id="srch-icon"></span>
            <input class="input input-with-icon-left" placeholder="Search campaigns…"/>
          </div>
          <button class="btn btn-secondary" id="filter-btn"></button>
          <div class="seg" style="margin-left:auto">
            <button class="active">List</button>
            <button>Calendar</button>
            <button>Performance</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr>
              <th>Campaign</th>
              <th>Audience</th>
              <th>Status</th>
              <th class="th-right">Sent</th>
              <th class="th-right">Open</th>
              <th class="th-right">Click</th>
              <th class="th-right">Revenue</th>
              <th>When</th>
              <th></th>
            </tr></thead>
            <tbody id="cmp-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="shell.js"></script>
  <script>
    renderAppShell('campaigns.html');
    document.getElementById('cal-btn').innerHTML = icon('calendar','4') + ' Calendar';
    document.getElementById('new-btn').innerHTML = icon('plus','4') + ' New campaign';
    document.getElementById('srch-icon').innerHTML = icon('search','4');
    document.getElementById('filter-btn').innerHTML = icon('filter','4') + ' Filter';

    const stats = [
      { label: 'Sent · 30d', value: '1.2M', sub: '+18% vs prev' },
      { label: 'Avg open rate', value: '48.2%', sub: 'Email only' },
      { label: 'Avg click rate', value: '12.4%', sub: 'All channels' },
      { label: 'Attributed revenue', value: '$184K', sub: 'Last 30 days' },
    ];
    document.getElementById('stats').innerHTML = stats.map(s => `
      <div class="card" style="padding:16px">
        <div class="text-muted" style="font-size:11.5px;font-weight:500">${s.label}</div>
        <div class="font-display fw-600 tabular" style="font-size:22px;margin-top:4px">${s.value}</div>
        <div class="text-subtle" style="font-size:11px;margin-top:2px">${s.sub}</div>
      </div>
    `).join('');

    const channels = {
      email: { icon: 'mail', color: 'var(--color-info-500)', bg: 'color-mix(in oklch, var(--color-info-500) 16%, transparent)', label: 'Email' },
      push: { icon: 'bell', color: 'color-mix(in oklch, var(--color-accent-500) 75%, black)', bg: 'color-mix(in oklch, var(--color-accent-500) 16%, transparent)', label: 'Push' },
      sms: { icon: 'message-square', color: 'color-mix(in oklch, var(--color-success-500) 75%, black)', bg: 'color-mix(in oklch, var(--color-success-500) 14%, transparent)', label: 'SMS' },
      inapp: { icon: 'smartphone', color: 'var(--color-brand-600)', bg: 'color-mix(in oklch, var(--color-brand-500) 14%, transparent)', label: 'In-app' },
    };
    const sTone = { sent: 'success', sending: 'info', scheduled: 'brand', draft: 'neutral', failed: 'danger' };
    const sLabel = { sent: 'Sent', sending: 'Sending…', scheduled: 'Scheduled', draft: 'Draft', failed: 'Failed' };
    const sDot = { sent: true, sending: true };

    const cmps = [
      { name: 'Black Friday · Tier 1 customers', channel: 'email', status: 'sent', audience: 'VIP — Last 90 days', audienceSize: '24,180', sent: '24,180', open: '62.4%', click: '18.2%', revenue: '$92,410', scheduled: 'Nov 24, 10:00 EST', owners: ['Sara K.', 'Mohit P.'] },
      { name: 'Cyber Monday — final hours', channel: 'push', status: 'scheduled', audience: 'All app users', audienceSize: '62,940', sent: '—', open: '—', click: '—', revenue: '—', scheduled: 'Dec 2, 18:00 EST', owners: ['Lana D.'] },
      { name: 'App update v3.4 announcement', channel: 'inapp', status: 'sending', audience: 'Active app users', audienceSize: '18,720', sent: '7,210', open: '—', click: '12.4%', revenue: '—', scheduled: 'In progress', owners: ['Tanvir A.'] },
      { name: 'Trial expiring in 3 days', channel: 'email', status: 'sent', audience: 'Trial · day 11', audienceSize: '4,210', sent: '4,210', open: '71.2%', click: '24.1%', revenue: '$18,940', scheduled: 'Daily · 09:00 local', owners: ['Mohit P.'] },
      { name: 'Cart abandonment SMS', channel: 'sms', status: 'failed', audience: 'Cart > $80', audienceSize: '1,840', sent: '412', open: '—', click: '8.4%', revenue: '—', scheduled: 'SMS provider · failed auth', owners: ['Lana D.'] },
      { name: 'Re-engagement · 30d dormant', channel: 'email', status: 'draft', audience: 'Dormant · 30d', audienceSize: '12,940', sent: '—', open: '—', click: '—', revenue: '—', scheduled: '—', owners: ['Sara K.'] },
    ];

    document.getElementById('cmp-body').innerHTML = cmps.map(c => {
      const ch = channels[c.channel];
      return `
      <tr>
        <td>
          <div class="row-center gap-3">
            <span style="width:36px;height:36px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;background:${ch.bg};color:${ch.color};flex-shrink:0">${icon(ch.icon,'4')}</span>
            <div style="min-width:0">
              <div class="fw-500 truncate" style="font-size:13.5px">${c.name}</div>
              <div class="row-center gap-2 text-muted" style="font-size:11px;margin-top:2px">
                <span>${ch.label}</span>
                <span class="dot-sep"></span>
                <span class="avatar-stack">${c.owners.map(o => avatarHTML(o,'xs')).join('')}</span>
              </div>
            </div>
          </div>
        </td>
        <td><div style="font-size:13px">${c.audience}</div><div class="text-muted tabular" style="font-size:11px">${c.audienceSize}</div></td>
        <td><span class="badge badge-${sTone[c.status]} ${sDot[c.status] ? 'badge-dot' : ''}">${sLabel[c.status]}</span></td>
        <td class="td-right tabular">${c.sent}</td>
        <td class="td-right tabular">${c.open}</td>
        <td class="td-right tabular">${c.click}</td>
        <td class="td-right tabular fw-500">${c.revenue}</td>
        <td class="text-muted" style="font-size:12px">${c.scheduled}</td>
        <td class="td-right">
          <button class="topbar-iconbtn" style="width:28px;height:28px">${icon('copy','3p5')}</button>
          <button class="topbar-iconbtn" style="width:28px;height:28px">${icon('more-horizontal','4')}</button>
        </td>
      </tr>`;
    }).join('');
  </script>
</body>
</html>
